services:
  # 1. Backend API (FastAPI + WebSockets + AI Engine)
  - type: web
    name: civicpulse-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: civicpulse-db
          property: connectionString

  # 2. Frontend SPA (React + Vite)
  - type: web
    name: civicpulse-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false

databases:
  # 3. Render Managed PostgreSQL Database
  - name: civicpulse-db
    region: oregon
    plan: free
    databaseName: civicpulse_db
    user: civicpulse_user

